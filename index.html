    explanation: `In a Geometric Progression (GP), the nth term is given by Tₙ = arⁿ⁻¹, where a is the first term and r is the common ratio.

Given:
T₃ = 48
T₆ = 14²/₉ = 128/9

Therefore:
T₃ = ar² = 48
T₆ = ar⁵ = 128/9

Dividing T₆ by T₃:
(ar⁵)/(ar²) = (128/9)/48

r³ = 128/432 = 8/27

Taking the cube root:
r = 2/3

a = 48 × 9/4

Hence, the first term of the GP is 108.`

1/x - 1/2 = 1/3 - 1/x

3(2 - x) = 2(x - 3)

Area = ½ × base × height
     = ½ × 3 × 4
     = 6 cm²

Since the prism has two triangular ends:

Area of the two ends = 2 × 6
                     = 12 cm²

Next, find the lateral surface area.

The perimeter of the triangular cross-section is:

3 + 4 + 5 = 12 cm

Therefore:

Lateral surface area = perimeter × length
